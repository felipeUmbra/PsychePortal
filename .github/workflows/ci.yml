name: Quality gates (PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs waste minutes; newer results are the ones that matter.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run test:unit

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          for i in {1..3}; do npx playwright install chromium && break || sleep 10; done
      - run: npm run test:e2e -- --project=chromium --grep "@accessibility"

  e2e-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          for i in {1..3}; do npx playwright install chromium && break || sleep 10; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright-chromium
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e -- --project=chromium --grep-invert "@accessibility"

  e2e-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright Firefox
        run: |
          for i in {1..3}; do npx playwright install firefox && break || sleep 10; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright-firefox
          key: ${{ runner.os }}-pw-firefox-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e -- --project=firefox --grep-invert "@accessibility"

  e2e-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright WebKit
        run: |
          for i in {1..3}; do npx playwright install webkit && break || sleep 10; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright-webkit
          key: ${{ runner.os }}-pw-webkit-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e -- --project=webkit --grep-invert "@accessibility"

  e2e-mobile-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          for i in {1..3}; do npx playwright install chromium && break || sleep 10; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright-chromium
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e -- --project=mobile-chrome --grep-invert "@accessibility"

  e2e-mobile-safari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - name: Install Playwright WebKit
        run: |
          for i in {1..3}; do npx playwright install webkit && break || sleep 10; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright-webkit
          key: ${{ runner.os }}-pw-webkit-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e -- --project=mobile-safari --grep-invert "@accessibility"

  build:
    needs: [typecheck, unit, accessibility, e2e-chromium, e2e-firefox, e2e-webkit, e2e-mobile-chrome, e2e-mobile-safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Production deploy, gated on the whole test-and-build job.
  # Runs only on a green `push` to main; skipped for PRs.
  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          node --version && npm --version
          npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}