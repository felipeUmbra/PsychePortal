name: CI

# Runs all testing scripts before building.
# The build step only executes if every prior step succeeds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript type check)
        run: npm run lint

      - name: Run E2E tests (Cypress)
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          browser: chrome

      # Reached only if lint and all Cypress tests passed.
      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload test reports (mochawesome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-reports
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 7
